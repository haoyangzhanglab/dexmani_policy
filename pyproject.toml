[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexmani_policy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0,<2.5.0",
    "numpy>=1.23,<2.0",
    "einops>=0.6",
    "hydra-core>=1.3",
    "diffusers>=0.25",
    "zarr>=2.16",
    "numba>=0.57",
    "omegaconf>=2.3",
    "tqdm>=4.64",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dexmani_policy*"]

