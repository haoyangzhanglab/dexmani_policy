[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["scripts/**", "data/**", "experiments/**", "robot_data/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["dexmani_policy"]

[tool.ruff.lint.per-file-ignores]
# Entry points set ROOT_DIR before imports — intentional, not fixable.
"train.py" = ["E402"]
"train_ddp.py" = ["E402"]
"smoke_test.py" = ["E402"]
"**/scripts/*.py" = ["E402"]
# __init__.py re-exports form the public API.
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
