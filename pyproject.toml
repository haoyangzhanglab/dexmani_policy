[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexmani_policy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4,<2.5",
    "torchvision>=0.19,<0.20",
    "numpy",
    "hydra-core>=1.3,<1.4",
    "omegaconf",
    "diffusers",
    "zarr>=2.18,<3",
    "numcodecs",
    "tqdm",
    "transformers",
    "timm>=1.0.22,<1.1",
    "safetensors",
    "accelerate",
    "tokenizers",
    "huggingface-hub",
    "peft",
    "wandb",
    "imageio-ffmpeg",
    "pyyaml",
]

[project.optional-dependencies]
preprocess = ["open3d"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dexmani_policy*"]

[tool.setuptools.package-data]
dexmani_policy = ["configs/*.yaml", "configs/tactile/*.yaml", "configs/pretrain/obs/*.yaml", "configs/pretrain/hand_prior/*.yaml"]
