[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dexmani_policy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4,<2.5",
    "torchvision>=0.19,<0.20",
    "numpy==1.26.4",
    "einops==0.8.2",
    "hydra-core>=1.3,<1.4",
    "omegaconf==2.3.1",
    "diffusers==0.27.2",
    "zarr>=2.18,<3",
    "numcodecs==0.13.1",
    "numba==0.66.0",
    "tqdm==4.68.3",
    "transformers==4.48.0",
    "timm==1.0.19",
    "safetensors==0.8.0",
    "accelerate==1.14.0",
    "tokenizers==0.21.4",
    "huggingface-hub==0.25.2",
    "peft==0.20.0",
    "wandb==0.22.3",
    "termcolor==3.3.0",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.10.9",
    "scikit-learn==1.7.2",
    "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dexmani_policy*"]

