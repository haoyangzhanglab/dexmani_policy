# Standard FlowMatch — pure rectified flow matching (PointAct style)
# Encoder:  PointNetDense (per-point features, 1024 points, 128d, xyz+rgb)
# Decoder:  DiTDiffusion (single timestep) + Euler ODE integration
# Modality: point_cloud + joint_state → action

policy_name: standard_flowmatch

# ── Task ──
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr

# ── Core ──
seed: 42
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action                    # action | action_ee
action_dim: ${eval:'21 if ${eq:${action_key},action_ee} else 19'}

# ── Dataloader ──
dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

val_dataloader:
  batch_size: 128
  shuffle: false
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  drop_last: false

# ── Dataset ──
dataset:
  _target_: dexmani_policy.datasets.pc_dataset.PCDataset
  action_key: ${action_key}
  zarr_path: ${zarr_path}
  seed: ${training.seed}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: ${eval:'${n_action_steps} - 1'}
  val_ratio: 0.0
  max_train_episodes: 80
  sensor_modalities: ["joint_state", "point_cloud"]
  obs_horizon: ${n_obs_steps}

  # Data augmentation aligned to official R3D-Policy.
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

# ── Agent ──
agent:
  _target_: dexmani_policy.agents.core.maniflow.StandardManiFlowAgent
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}

  encoder_type: pointnet_dense
  pc_dim: 6                       # xyz+rgb
  state_dim: 19
  num_points: 1024                # per-point token count per frame

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true

  # PointNetDense encoder — per-point MLP, no pooling
  pc_encoder_config:
    out_channels: 128
    num_points: 1024
    hidden_dims: [64, 128, 256]

  # DiTX backbone
  n_layers: 12
  hidden_dim: 768
  n_head: 8
  mlp_ratio: 4.0
  p_drop_attn: 0.1
  qkv_bias: false
  qk_norm: false
  pre_norm_modality: false

  timestep_embed_dim: 128

  # Standard flow matching
  denoise_timesteps: 10
  t_sample_mode: beta
  beta_s: 0.999
  beta_alpha: 1.0
  beta_beta: 1.5

  modality_dropout_probs:
    joint_state: 0.0                # 20% state dropout — forces reliance on point cloud

# ── Optimizer ──
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-3            # DiT backbone: high wd is standard for transformers
  betas: [0.9, 0.95]              # lower β1 = shorter gradient EMA, common for flow matching
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6        # PC encoder: lighter regularization than DiT backbone

# ── EMA ──
ema:
  _target_: dexmani_policy.training.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# ── Training ──
training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  use_ema: true
  use_ema_teacher_for_consistency: false   # standard flow match: no consistency training
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000
    log_interval_steps: 50
    gradient_accumulation_steps: 1

# ── Workspace ──
workspace:
  _target_: dexmani_policy.training.workspace.TrainWorkspace
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${now:%Y-%m-%d_%H-%M}_${training.seed}
    id: ${policy_name}_${task_name}_${training.seed}
    resume: allow
    mode: offline
    video_fps: 15

  checkpoint_cfg:
    _target_: dexmani_policy.training.workspace.CheckpointConfig
    monitor_key: test_mean_score
    mode: max
    topk: 3

# ── Env Runner ──
env_runner:
  _target_: dexmani_policy.env_runner.sim_runner.SimRunner
  task_name: ${task_name}
  n_obs_steps: ${n_obs_steps}
  default_eval_episodes: 25        # PC-based policies: 25; RGB-based: 20
  sensor_modalities: ${dataset.sensor_modalities}
  # ── ACT temporal ensembling (Zhao et al. 2023, arXiv:2304.13705) ──
  temporal_ensemble_coeff: 0.01
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    texture_random: false
    instance_random: true
    table_random: true

# ── Eval ──
eval:
  denoise_steps: 4
  denoise_timesteps_list: null
  use_ema: true

  select_best:
    initial_episodes: 25
    batch_size: 5
    max_episodes: 100

  offline:
    episodes: 100

  demo:
    episodes: 5
    viewer_resolution: [1920, 1080]

  video:
    enabled: true
    fps: null

# ── Hydra ──
hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
    subdir: ${hydra.job.num}
