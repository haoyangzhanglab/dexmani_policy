defaults:
  - common
  - _self_

# DP3：基于点云观测的扩散策略。

policy_name: dp3

horizon: 16
n_obs_steps: 2
n_action_steps: 8

normalization:
  joint_state: limits
  point_cloud: limits

dataloader:
  batch_size: 128
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.demonstration.DemonstrationDataset
  sensor_modalities: ["joint_state", "point_cloud"]

  # 点 dropout 在 Dataset 中执行。
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
      dropout:     {max_dropout_ratio: 0.8, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  clip_sample: true
  _target_: dexmani_policy.agents.policies.dp3.DP3Policy

  encoder_type: dp3  # dp3：MLP；idp3：Conv。
  pc_dim: 6
  pc_out_dim: 128
  state_dim: 19
  num_points: 1024

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: false

  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_bfloat16: true
  use_compile: true
  use_ema: true
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000

eval:
  inference_steps: 10
  use_ema: true
