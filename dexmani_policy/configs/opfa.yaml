# OPFA (One-Policy-Fits-All) — DP3 diffusion in GaLR latent space
# Stage 1: Train GaLR autoencoder (offline, task-agnostic)
# Stage 2: Pre-compute hand latents for trajectory data
# Stage 3: Train OPFA policy (DP3 UNet in 1031-d latent space)
# Stage 4: Inference — UNet denoise→decode hand latent→assemble native action
#
# Prerequisites:
#   - Trained GaLR checkpoint (galr_ckpt_path)
#   - Pre-computed latent file (dataset.latent_path)
#
# Action space: 1031 = 7 (arm joint angles, normalized) + 1024 (hand latent)
# Observation: scene PC (xyz only, 1024 pts) + hand latent (1024-d)
# NOTE: NO arm proprioception in observation (faithful to OPFA paper).

policy_name: opfa

# ── Task ──
task_name: pour
zarr_path: robot_data/${task_name}.zarr

# ── Core ──
seed: 42
horizon: 16
n_obs_steps: 4
n_action_steps: 8
action_key: action                    # joint space (not EE)

# OPFA latent space: 7 arm + 1024 hand latent
action_dim: 1031
arm_dim: 7
hand_latent_dim: 1024

# ── Dataloader ──
dataloader:
  batch_size: 64                      # Reduced for larger UNet [512,1024,2048]
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

val_dataloader:
  batch_size: 128                    # Align with official OPFA (dp3.yaml:93)
  shuffle: false
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  drop_last: false

# ── Dataset ──
dataset:
  _target_: dexmani_policy.datasets.opfa_dataset.OPFADataset
  latent_path: robot_data/${task_name}_opfa_latents.pt   # pre-computed latents
  action_key: ${action_key}
  zarr_path: ${zarr_path}
  seed: ${training.seed}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: ${eval:'${n_action_steps} - 1'}
  val_ratio: 0.05
  sensor_modalities: ["joint_state", "point_cloud"]
  obs_horizon: ${n_obs_steps}

  # Data augmentation (standard DP3 settings)
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      # No color augmentation — OPFA uses xyz-only point clouds (pc_dim=3)
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

# ── Agent ──
agent:
  _target_: dexmani_policy.agents.core.opfa.OPFAAgent
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}         # 1031
  arm_dim: ${arm_dim}               # 7
  hand_latent_dim: ${hand_latent_dim}  # 1024

  encoder_type: dp3                  # scene PC encoder (matching OPFA paper: PointNet)
  pc_dim: 3                         # OPFA: xyz only (no color)
  pc_out_dim: 64                    # OPFA: 64-d global token
  norm_before_activation: true      # Match official PointNetEncoderXYZ (Linear→LN→ReLU)
  num_points: 1024                  # FPS downsampled
  hand_out_dim: 64

  # GaLR decoder (frozen for inference)
  galr_ckpt_path: data/pretrained/galr/best.pt

  # UNet (match DP3 scale — 1031-d action space is memory-intensive)
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]   # Align with official OPFA dp3.yaml
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true

# ── Optimizer ──
optimizer:
  lr: 4.0e-4                        # Higher LR (OPFA paper: 4e-4 for latent-space policy)
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 4.0e-4
  obs_weight_decay: 1.0e-6

# ── EMA ──
ema:
  _target_: dexmani_policy.training.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# ── Training ──
training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  use_ema: true
  use_ema_teacher_for_consistency: false
  lr_scheduler: cosine
  lr_warmup_steps: 300                # Align with official OPFA (dp3.yaml:113)
  max_grad_norm: 10.0               # higher clipping for 1031-d target
  loop:
    total_train_steps: 100000
    log_interval_steps: 50
    gradient_accumulation_steps: 8  # effective batch = 64×8 = 512 (align with official)

# ── Workspace ──
workspace:
  _target_: dexmani_policy.training.workspace.TrainWorkspace
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${now:%Y-%m-%d_%H-%M}_${training.seed}
    id: ${policy_name}_${task_name}_${training.seed}
    resume: allow
    mode: offline
    video_fps: 15

  checkpoint_cfg:
    _target_: dexmani_policy.training.workspace.CheckpointConfig
    monitor_key: test_mean_score
    mode: max
    topk: 3

# ── Env Runner ──
env_runner:
  _target_: dexmani_policy.env_runner.sim_runner.SimRunner
  task_name: ${task_name}
  n_obs_steps: ${n_obs_steps}
  default_eval_episodes: 25
  sensor_modalities: ${dataset.sensor_modalities}
  temporal_ensemble_coeff: 0.01
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    texture_random: false
    instance_random: true
    table_random: true

# ── Eval ──
eval:
  denoise_steps: 10
  denoise_timesteps_list: null
  use_ema: true

  select_best:
    initial_episodes: 25
    batch_size: 5
    max_episodes: 100

  offline:
    episodes: 100

  demo:
    episodes: 5
    viewer_resolution: [1920, 1080]

  video:
    enabled: true
    fps: null

# ── Hydra ──
hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
    subdir: ${hydra.job.num}
