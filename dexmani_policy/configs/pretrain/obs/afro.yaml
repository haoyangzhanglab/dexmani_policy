# @package _global_
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr
normalization:
  point_cloud: limits
dataset:
  _target_: dexmani_policy.datasets.pretrain.afro.AFROPretrainDataset
  zarr_path: ${zarr_path}
  horizon: 33
  frame_stride: 2
  pad_before: 0
  pad_after: 7
  seed: 42
  val_episodes: 0
  max_train_episodes: null
dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 8
  pin_memory: true
optimizer:
  lr: 1.0e-4
  betas: [0.95, 0.999]
  weight_decay: 1.0e-6
training:
  seed: 42
  device: cuda:0
  num_epochs: 301
  lr_scheduler: cosine
  lr_warmup_steps: 5
  val_every_epochs: 200
  save_every_epochs: 20
  loop:
    gradient_accumulation_steps: 1
    log_interval_steps: 100
workspace:
  output_dir: experiments/pretrain/afro/${task_name}/${run_id:}_seed${training.seed}
  wandb_cfg: null
