# @package _global_
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr
normalization:
  point_cloud: limits
model:
  frame_stride: 2
dataset:
  _target_: dexmani_policy.datasets.pretrain.afro.AFROPretrainDataset
  zarr_path: ${zarr_path}
  horizon: 33
  pad_before: 0
  pad_after: 7
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  split_manifest: null
dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  drop_last: false
optimizer:
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6
training:
  seed: 42
  device: cuda:0
  num_epochs: 301
  lr_scheduler: cosine
  lr_warmup_steps: 5
  val_every_epochs: 200
  save_every_epochs: 20
  loop:
    total_train_steps: null
    gradient_accumulation_steps: 1
    log_interval_steps: 100
workspace:
  output_dir: experiments/pretrain/obs/afro/${task_name}/${run_id:}_seed${training.seed}
  wandb_cfg: null
