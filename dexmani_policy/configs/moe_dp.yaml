# MoE-DP — Diffusion Policy with Mixture of Experts (RGB-based)
# Encoder:  RGB backbone (R3M-resnet18, 512d) + 16-expert MoE gating (top-2)
# Decoder:  ConditionalUnet1D (FiLM conditioning) + DDIM
# Modality: RGB + joint_state → action
#
# Architecture follows official MoE-DP:
#   obs_encoder → cond_obs_emb(Linear) → MoE → global_cond → ConditionalUnet1D

policy_name: moe_dp

# ── Task ──
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr

# ── Core ──
seed: 42
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action                    # action | action_ee
action_dim: ${eval:'21 if ${eq:${action_key},action_ee} else 19'}

# ── Dataloader (aligned with official: drop_last=True, no prefetch) ──
dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  drop_last: true

val_dataloader:
  batch_size: 128
  shuffle: false
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  drop_last: true

# ── Dataset ──
dataset:
  _target_: dexmani_policy.datasets.rgb_dataset.RGBDataset
  action_key: ${action_key}
  zarr_path: ${zarr_path}
  seed: ${training.seed}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: ${eval:'${n_action_steps} - 1'}
  val_ratio: 0.0
  max_train_episodes: 80
  sensor_modalities: ["joint_state", "rgb"]
  obs_horizon: ${n_obs_steps}
  rgb_preprocess_size: [240, 240]
  rgb_random_crop_size: [224, 224]

  # Conservative RGB augmentation — 25% trigger rate, mild magnitudes
  rgb_color_aug:
    _target_: dexmani_policy.datasets.augmentation.ImageAug
    brightness: 0.3
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
    grayscale_prob: 0.1
    noise_std: 0.0
    blur_prob: 0.0
    prob: 0.25

  augmentation_cfg:
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

# ── Agent ──
agent:
  _target_: dexmani_policy.agents.core.moe.MoEAgent
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}

  # RGB backbone — default R3M-resnet18 (512d), full finetuning
  rgb_backbone_name: r3m
  rgb_backbone_config:
    model_name: resnet18               # 512d | resnet34(512d) | resnet50(2048d)
    tune_mode: full
    norm_mode: group_norm              # R3M BN→GN, EMA-safe
    global_token_type: avg
    image_size: [224, 224]

  state_dim: 19
  state_out_dim: 64

  # ── MoE Gating (aligned with official MoE-DP) ──
  # Official pattern: CNN(64d) → cond_obs_emb → Linear(64→256) EXPAND → MoE(256→256) → UNet(cond=512).
  # We replicate it: R3M+state(576d) → obs_proj → Linear(576→256) COMPRESS → MoE(256→256) → UNet(cond=512).
  # The fixed 256-d embedding is the key design parameter — it keeps the MoE compact and the
  # UNet conditioning manageable, preventing rapid overfitting that starves the gate of gradient signal.
  num_experts: 16
  top_k: 2
  moe_out_dim: 256                     # official n_emb=256 — fixed MoE workspace
  moe_hidden_ratio: 4                  # 4×256=1024, matches official hidden_dim
  moe_num_layers: 2
  lambda_load: 1.0
  beta_entropy: 0.1
  aux_loss_weight: 0.1
  activation: relu                     # official uses ReLU (not GELU)

  # Boost (progressive expert activation)
  use_boost: false
  boost_start_epoch: 0
  boost_interval: 100
  boost_experts_per_step: 4
  boost_topk_per_step: 1

  # Enhanced gate (matched to official: Linear→ReLU→Dropout→Linear)
  use_enhanced_gate: true
  gate_hidden_dim: 256                  # official gate_dim=256
  gate_dropout: 0.1                     # official p_drop_attn=0.1

  # Diffusion backbone
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]         
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

  num_training_steps: 100
  num_inference_steps: 100              # official: full 100-step DDPM inference
  prediction_type: sample

  modality_dropout_probs:
    joint_state: 0.0

# ── Optimizer (aligned with official: single LR for all params) ──
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4                        # unified LR (official uses single AdamW)
  obs_weight_decay: 1.0e-6

# ── EMA ──
ema:
  _target_: dexmani_policy.training.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# ── Training ──
training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: false                    # official float32; MoE gate softmax needs precision
  use_compile: false                     # CUDA Graphs add memory overhead
  use_ema: true
  use_ema_teacher_for_consistency: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0                      # gradient clipping at 1.0
  loop:
    total_train_steps: 100000
    log_interval_steps: 50
    gradient_accumulation_steps: 1

# ── Workspace ──
workspace:
  _target_: dexmani_policy.training.workspace.TrainWorkspace
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${now:%Y-%m-%d_%H-%M}_${training.seed}
    id: ${policy_name}_${task_name}_${training.seed}
    resume: allow
    mode: offline
    video_fps: 15  # decoupled from env_runner; default matches frame_skip(16)/time_step(1/240)

  checkpoint_cfg:
    _target_: dexmani_policy.training.workspace.CheckpointConfig
    monitor_key: test_mean_score
    mode: max
    topk: 3

# ── Env Runner ──
env_runner:
  _target_: dexmani_policy.env_runner.sim_runner.SimRunner
  task_name: ${task_name}
  n_obs_steps: ${n_obs_steps}
  default_eval_episodes: 25
  sensor_modalities: ${dataset.sensor_modalities}
  # ── ACT temporal ensembling (Zhao et al. 2023, arXiv:2304.13705) ──
  # Blend overlapping action-chunk predictions via exponential weighting
  # to smooth transitions between consecutive inference calls.
  # Default: 0.01. Set to null to disable.
  temporal_ensemble_coeff: 0.01
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    # ── Domain randomization (convenience switches) ──
    texture_random: false
    instance_random: true
    table_random: true

# ── Eval ──
eval:
  denoise_steps: 10
  denoise_timesteps_list: null
  use_ema: true

  select_best:
    initial_episodes: 25
    batch_size: 5
    max_episodes: 100

  offline:
    episodes: 100

  demo:
    episodes: 5
    viewer_resolution: [1920, 1080]

  video:
    enabled: true
    fps: null
# ── Hydra ──
hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
    subdir: ${hydra.job.num}
