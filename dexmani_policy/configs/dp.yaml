defaults:
  - common
  - _self_

# DP：基于 RGB 观测的扩散策略。

policy_name: dp

initialization:
  rgb: null

horizon: 16
n_obs_steps: 2
n_action_steps: 8

normalization:
  rgb: identity
  joint_state: limits

dataloader:
  batch_size: 64
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.demonstration.DemonstrationDataset
  sensor_modalities: ["joint_state", "rgb"]
  rgb_preprocess_size: [84, 84]
  rgb_random_crop_size: [76, 76]

  # 配置颜色增强时，训练与评测均使用浮点插值。
  rgb_color_aug:
    _target_: dexmani_policy.datasets.transforms.ImageAugmentation
    brightness: 0.3
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
    grayscale_prob: 0.1
    prob: 0.25

  augmentation_cfg:
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  clip_sample: true
  _target_: dexmani_policy.agents.policies.dp.DP

  rgb_backbone_name: resnet
  rgb_backbone_config:
    model_name: resnet18
    tune_mode: full
    norm_mode: group_norm
    image_size: [76, 76]

  state_dim: 19
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_compile: true

eval:
  inference_steps: ${agent.num_inference_steps}

# 切换时整体替换 rgb_backbone_config，避免将 ResNet 的 model_name/norm_mode 传给 ViT。
# 可选 DINOv2：替换上面对应配置块。
# initialization:
#   rgb: data/pretrained/dinov2-small
# dataset:
#   rgb_preprocess_size: [240, 240]
#   rgb_random_crop_size: [224, 224]
# agent:
#   rgb_backbone_name: dino
#   rgb_backbone_config:
#     tune_mode: lora
#     image_size: [224, 224]
