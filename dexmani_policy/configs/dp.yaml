# DP：基于 RGB 观测的扩散策略。

policy_name: dp

task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr

seed: 42
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action  # action：关节；action_ee：末端。
action_dim: ${eval:'21 if ${eq:${action_key},action_ee} else 19'}

normalization:
  joint_state: limits
  action: auto
  rgb: identity

dataloader:
  batch_size: 64
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.common.robot_dataset.RobotDataset
  action_key: ${action_key}
  zarr_path: ${zarr_path}
  seed: 42  # 数据划分/子集 seed，独立于训练 seed。
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: 7
  val_ratio: 0.0
  max_train_episodes: 80
  sensor_modalities: ["joint_state", "rgb"]
  obs_horizon: ${n_obs_steps}
  rgb_preprocess_size: [240, 240]
  rgb_random_crop_size: [224, 224]
  rgb_keep_uint8: true

  # 配置颜色增强时，训练与评测均使用浮点插值。
  rgb_color_aug:
    _target_: dexmani_policy.datasets.common.augmentation.ImageAugmentation
    brightness: 0.3
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
    grayscale_prob: 0.1
    noise_std: 0.0
    blur_prob: 0.0
    prob: 0.25

  augmentation_cfg:
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  clip_sample: true
  _target_: dexmani_policy.agents.policies.dp.DPPolicy
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}

  rgb_backbone_name: dino
  rgb_backbone_config:
    model_name: facebook/dinov2-small
    tune_mode: lora
    lora_dtype: float32
    global_token_type: avg
    image_size: [224, 224]

  state_dim: 19
  modality_dropout_probs:
    joint_state: 0.0

  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

ema:
  _target_: dexmani_policy.training.common.optimization.EMA
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  use_ema: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000
    log_interval_steps: 100
    gradient_accumulation_steps: 1

workspace:
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${run_id:}_seed${training.seed}
    mode: offline

env_runner:
  task_name: ${task_name}
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    randomize_model_id: true
    randomize_table_height: true

eval:
  seed: 1024
  inference_steps: 10
  use_ema: true

  action_steps: null
  episodes: 70
  selection_episodes: 25
  seeds: null

  video:
    enabled: true

hydra:
  run:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
    subdir: ${hydra.job.num}
