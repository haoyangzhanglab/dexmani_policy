defaults:
  - common
  - _self_

# DP：基于 RGB 观测的扩散策略。

policy_name: dp

initialization:
  rgb: data/pretrained/dinov2-small

normalization:
  rgb: identity
  joint_state: limits

dataloader:
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.demonstration.DemonstrationDataset
  sensor_modalities: ["joint_state", "rgb"]
  rgb_preprocess_size: [240, 240]
  rgb_random_crop_size: [224, 224]

  # 配置颜色增强时，训练与评测均使用浮点插值。
  rgb_color_aug:
    _target_: dexmani_policy.datasets.transforms.ImageAugmentation
    brightness: 0.3
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
    grayscale_prob: 0.1
    prob: 0.25

  augmentation_cfg:
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  clip_sample: true
  _target_: dexmani_policy.agents.policies.dp.DP

  rgb_backbone_name: dino
  rgb_backbone_config:
    tune_mode: lora
    image_size: [224, 224]

  state_dim: 19
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_bfloat16: false
  use_compile: true
  use_ema: true
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000

eval:
  inference_steps: ${agent.num_inference_steps}
  use_ema: ${training.use_ema}
