# Single-step LAMP BC with a frozen history-conditioned prior.
policy_name: lamp
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr
seed: 42
horizon: 1
n_obs_steps: 1
n_action_steps: 1
action_key: action
action_dim: 19

lamp:
  history_steps: 8
  latent_dim: 2
  hidden_dim: 256
  prior_path: experiments/lamp_prior/${task_name}/prior.pt

normalization:
  joint_state: gaussian
  action: identity
  point_cloud: identity

dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.hand_prior.lamp_dataset.LAMPDataset
  zarr_path: ${zarr_path}
  action_key: ${action_key}
  pc_dim: ${agent.pc_dim}
  seed: 42
  horizon: ${horizon}
  obs_horizon: ${n_obs_steps}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: 0
  val_ratio: 0.1
  max_train_episodes: null
  split_manifest: null
  sensor_modalities: [joint_state, point_cloud]
  history_steps: ${lamp.history_steps}
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color: {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
      dropout: {max_dropout_ratio: 0.8, prob: 1.0}

agent:
  _target_: dexmani_policy.agents.policies.lamp.LAMPPolicy
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}
  prior_path: ${lamp.prior_path}
  history_steps: ${lamp.history_steps}
  latent_dim: ${lamp.latent_dim}
  prior_hidden_dim: ${lamp.hidden_dim}
  pc_dim: 6
  state_dim: 19
  state_out_dim: 64
  num_points: 1024
  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true
  pc_encoder_config:
    channels: 384
    num_patches: 96
    group_size: 32
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    geometry_scale: 0.10
    rope_scale: 0.05
    rope_base: 100.0
  num_inference_steps: 1
  hand_loss_weight: 1.0
  drift_reg_weight: 1.0
  history_noise_std: 0.10
  arm_state_noise_std: 0.10
  modality_dropout_probs:
    joint_state: 0.0

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-4

training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  use_ema: false
  lr_scheduler: cosine_min_lr
  lr_min_ratio: 0.01
  lr_warmup_steps: 1000
  max_grad_norm: 1.0
  loop:
    total_train_steps: 20000
    log_interval_steps: 100
    gradient_accumulation_steps: 1

workspace:
  _target_: dexmani_policy.training.workspace.Workspace
  output_dir: ${hydra:runtime.output_dir}
  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${run_id:}_seed${training.seed}
    mode: offline

env_runner:
  task_name: ${task_name}
  # Independent simulator state for each evaluation episode.
  clear_cache_freq: 1
  env_kwargs:
    control_mode: joint
    texture_random: false
    instance_random: true
    table_random: true

eval:
  seed: 1024
  inference_steps: 1
  use_ema: false
  action_steps: null
  episodes: 70
  selection_episodes: 25
  task_seeds: null

  video:
    enabled: true

hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
    subdir: ${hydra.job.num}
