# 供主策略继承；独立预训练使用各自的配方。
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr
seed: 42
action_key: action  # action：关节；action_ee：末端，仅适用于支持该模式的策略。

dataloader:
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

dataset:
  seed: 42  # 数据划分与训练 seed 独立。
  val_ratio: 0.1
  max_train_episodes: 100
  split_manifest: null

agent:
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}

ema:
  _target_: dexmani_policy.training.common.optimization.EMA
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

training:
  lr_scheduler: cosine
  seed: ${seed}
  device: cuda:0
  loop:
    log_interval_steps: 100
    gradient_accumulation_steps: 1

env_runner:
  env_kwargs:
    randomize_model_id: true
    randomize_table_height: true

eval:
  seed: 1024
  selection_episodes: 25
  episodes: 100
  action_steps: null
  seeds: null
  video:
    enabled: true

workspace:
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${run_id:}_seed${training.seed}
    mode: offline

hydra:
  run:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
    subdir: ${hydra.job.num}
