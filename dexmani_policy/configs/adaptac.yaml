defaults:
  - common
  - _self_
  - tactile: sim_force

# AdapTac 扩展：分指未来力预测、池化前双向交互与力引导融合。

policy_name: adaptac
tactile_source: ???

horizon: 20
n_obs_steps: 1
n_action_steps: 8

normalization:
  joint_state: limits
  action: auto
  point_cloud: identity

dataloader:
  batch_size: 128
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.variants.tactile.AdapTacDataset

  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  clip_sample: true
  _target_: dexmani_policy.agents.policies.adaptac.AdapTacPolicy

  pc_dim: 6
  feature_dim: 512
  state_out_dim: 64
  state_dim: 19
  num_points: 1024

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: false

  pc_encoder_config:
    channels: 384
    num_patches: 96
    group_size: 32
    depth: 4
    num_heads: 8
    mlp_ratio: 2.0
    geometry_scale: 0.10
    rope_scale: 0.05
    rope_base: 100.0

  diffusion_step_embed_dim: 256
  down_dims: [256, 512]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

  num_training_steps: 100
  num_inference_steps: 20
  force_num_inference_steps: 20
  force_loss_weight: 1.0
  force_predictor_config:
    n_layer: 8
    n_head: 4
    n_emb: 256
    p_drop_emb: 0.0
    p_drop_attn: 0.3
  fusion_num_heads: 8
  fusion_dropout: 0.1

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_bfloat16: true
  use_compile: false
  use_ema: true
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000

eval:
  inference_steps: ${agent.num_inference_steps}
  use_ema: true
