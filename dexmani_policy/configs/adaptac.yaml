defaults:
  - common
  - _self_
  - tactile: force

# AdapTac 扩展：分指未来力预测、池化前双向交互与力引导融合。
# 本项目适配：Point Transformer 场景编码、五指触觉 token、历史特征拼接及 joint state 条件。
# 默认预测 q+1…q+15 的五指绝对力；identity 保留数据单位和传感器坐标。
# 当前仿真值为传感器轴力 / [50,50,100] N（法向 max(0,-z)，生产端裁剪），不是原始牛顿值。

policy_name: adaptac

horizon: 16
n_obs_steps: 2
n_action_steps: 8

normalization:
  point_cloud: identity
  joint_state: limits

dataloader:
  batch_size: 128
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.variants.tactile.AdapTacDataset

  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  clip_sample: true
  _target_: dexmani_policy.agents.policies.adaptac.AdapTac

  pc_dim: 6
  feature_dim: 512
  state_out_dim: 64
  num_points: 1024

  fps_random_config:
    use_random: true
    use_random_start: true
    use_shuffle_output: false

  pc_encoder_config:
    channels: 192
    num_patches: 128
    group_size: 32
    depth: 2
    num_heads: 8
    mlp_ratio: 2.0
    geometry_scale: 0.10
    rope_scale: 0.05
    rope_base: 100.0

  diffusion_step_embed_dim: 256
  down_dims: [256, 512]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

  num_training_steps: 100
  num_inference_steps: 20
  force_num_inference_steps: 20
  force_loss_weight: 1.0  # 0 只取消显式力监督；预测、guide 及在线采样仍运行。
  force_predictor_config:
    depth: 8
    num_heads: 4
    embed_dim: 256
    dropout: 0.3
  fusion_num_heads: 8
  fusion_dropout: 0.1

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_compile: false

eval:
  inference_steps: ${agent.num_inference_steps}
