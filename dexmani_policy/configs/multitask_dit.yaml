# MultiTask DiT — Multi-task policy with text-conditioned DiT backbone
# Encoder:  CLIP ViT-B/16 text encoder (frozen) + regular ResNet-18 vision backbone (resnet preset, scratch + GroupNorm)
# Decoder:  DiT Diffusion (self-attention + AdaLN conditioning)
# Modality: RGB + joint_state + task_text → action
# Tasks:    pick_bottle, open_box

policy_name: multitask_dit

# ── Tasks ──
task_name: pick_bottle+open_box
seed: 42

# ── Core ──
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action                    # action | action_ee
action_dim: ${eval:'21 if ${eq:${action_key},action_ee} else 19'}

# ── Normalization ──
normalization:
  joint_state: limits
  action: auto
  rgb: identity

# ── Dataloader ──
dataloader:
  batch_size: 64
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

# ── Dataset ──
dataset:
  _target_: dexmani_policy.datasets.multitask_dataset.MultiTaskDataset
  seed: ${training.seed}
  sampling_strategy: balanced          # proportional | balanced | weighted
  action_key: ${action_key}

  # Joint-state augmentation — mild Gaussian noise, always-on (prob: 1.0).
  augmentation_cfg:
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

  task_names:
    - pick_bottle
    - open_box

  task_texts:
    - "pick up the bottle"
    - "open the box"

  datasets:
    - _target_: dexmani_policy.datasets.rgb_dataset.RGBDataset
      action_key: ${action_key}
      zarr_path: robot_data/pick_bottle.zarr
      seed: ${seed}
      horizon: ${horizon}
      pad_before: ${eval:'${n_obs_steps} - 1'}
      pad_after: ${eval:'${n_action_steps} - 1'}
      val_ratio: 0.0
      max_train_episodes: 80
      sensor_modalities: ['joint_state', 'rgb']
      obs_horizon: ${n_obs_steps}
      rgb_preprocess_size: [240, 240]
      rgb_random_crop_size: [224, 224]
      rgb_color_aug:
        _target_: dexmani_policy.datasets.common.augmentation.ImageAugmentation
        brightness: 0.3
        contrast: 0.2
        saturation: 0.2
        hue: 0.05
        grayscale_prob: 0.1
        noise_std: 0.0
        blur_prob: 0.0
        prob: 0.25

    - _target_: dexmani_policy.datasets.rgb_dataset.RGBDataset
      action_key: ${action_key}
      zarr_path: robot_data/open_box.zarr
      seed: ${seed}
      horizon: ${horizon}
      pad_before: ${eval:'${n_obs_steps} - 1'}
      pad_after: ${eval:'${n_action_steps} - 1'}
      val_ratio: 0.0
      max_train_episodes: 80
      sensor_modalities: ['joint_state', 'rgb']
      obs_horizon: ${n_obs_steps}
      rgb_preprocess_size: [240, 240]
      rgb_random_crop_size: [224, 224]
      rgb_color_aug:
        _target_: dexmani_policy.datasets.common.augmentation.ImageAugmentation
        brightness: 0.3
        contrast: 0.2
        saturation: 0.2
        hue: 0.05
        grayscale_prob: 0.1
        noise_std: 0.0
        blur_prob: 0.0
        prob: 0.25

# ── Agent ──
agent:
  clip_sample: true
  _target_: dexmani_policy.agents.core.multitask_policy.MultiTaskPolicy
  text_encoder_model: openai/clip-vit-base-patch16
  task_texts: ${dataset.task_texts}
  rgb_backbone_name: resnet
  rgb_backbone_config:
    model_name: resnet18
    weights: null               # Random initialization; GroupNorm is trained with the backbone.
    tune_mode: full
    norm_mode: group_norm
    image_size: [224, 224]
  # rgb_backbone_name: dino
  # rgb_backbone_config:
  #   model_name: facebook/dinov2-small  # 384d
  #   tune_mode: lora
  #   global_token_type: avg
  #   image_size: [224, 224]
  state_dim: 19
  state_out_dim: 64

  # DiT backbone
  n_emb: 512
  num_heads: 8
  n_layers: 8
  mlp_ratio: 4.0
  qkv_bias: true
  attn_drop: 0.1
  proj_drop: 0.1

  action_decoder_type: diffusion     # diffusion | rectified_flow

  # Diffusion
  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample

  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}
  modality_dropout_probs:
    joint_state: 0.0

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6


ema:
  _target_: dexmani_policy.training.common.ema.EMA
  accumulation_dtype: float32
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# ── Training ──
training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  use_ema: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000
    log_interval_steps: 100
    gradient_accumulation_steps: 1


workspace:
  _target_: dexmani_policy.training.workspace.Workspace
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${run_id:}_seed${training.seed}
    mode: offline

env_runner:
  _target_: dexmani_policy.env_runner.multi_task_sim_runner.MultiTaskSimRunner
  n_obs_steps: ${n_obs_steps}
  default_eval_episodes: 20
  sensor_modalities: ['joint_state', 'rgb']
  task_configs:
    - task_name: pick_bottle
      task_text: ${dataset.task_texts[0]}
      env_kwargs:
        control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
        texture_random: false  # Randomize textures, skybox, lights and camera pose.
        instance_random: true
        table_random: true
    - task_name: open_box
      task_text: ${dataset.task_texts[1]}
      env_kwargs:
        control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
        texture_random: false  # Randomize textures, skybox, lights and camera pose.
        instance_random: true
        table_random: true

# ── Eval ──
eval:
  seed: 1024
  inference_steps: 10
  inference_steps_list: null
  use_ema: true

  select_best:
    initial_episodes: 25
    batch_size: 5
    max_episodes: 100

  offline:
    episodes: 70

  demo:
    episodes: 5
    viewer_resolution: [1280, 960]

  video:
    enabled: true
    fps: null

hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
    subdir: ${hydra.job.num}
