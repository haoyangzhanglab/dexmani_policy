# R3D：使用 Uni3D 编码器的三维扩散策略。

policy_name: r3d

task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr

seed: 42
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action  # action：关节；action_ee：末端。
use_aux_ee: false  # 启用时要求 action_key=action，末端姿态仅作辅助预测。
joint_dim: 19
ee_dim: 9  # action_ee[:9]：位置 3 维 + rot6d 6 维。
action_dim: ${eval:'${joint_dim} + ${ee_dim} if ${use_aux_ee} else (21 if ${eq:${action_key},action_ee} else ${joint_dim})'}

normalization:
  joint_state: limits
  action: auto
  point_cloud: limits

dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

dataset:
  _target_: ${eval:'"dexmani_policy.datasets.r3d_dataset.R3DAuxDataset" if ${use_aux_ee} else "dexmani_policy.datasets.common.robot_dataset.RobotDataset"'}
  action_key: ${action_key}
  zarr_path: ${zarr_path}
  seed: 42  # 数据划分/子集 seed，独立于训练 seed。
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: 7
  val_ratio: 0.0
  max_train_episodes: 80
  sensor_modalities: ["joint_state", "point_cloud"]
  obs_horizon: ${n_obs_steps}

  # 点 dropout 在 Uni3D 内执行。
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  clip_sample: true
  _target_: dexmani_policy.agents.policies.r3d.R3DPolicy
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}
  use_aux_ee: ${use_aux_ee}
  joint_dim: ${joint_dim}
  ee_dim: ${ee_dim}
  aux_loss_weight: 1.0

  state_dim: 19
  state_out_dim: 256

  pc_encoder_config:
    pc_model: eva02_tiny_patch14_224
    embed_dim: 256
    num_group: 512
    group_size: 32
    pc_in_channels: 6  # Uni3D 内部 XYZRGB 特征维度，固定为 6。
    patch_dropout: 0.0
    drop_path_rate: 0.2
    use_pretrained_weights: true
    pretrained_weights_path: data/pretrained/uni3d

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true

  timestep_embed_dim: 128
  embedding_dim: 256
  depth: 4
  num_heads: 8
  mlp_dim: 2048
  attention_downsample_rate: 2

  modality_dropout_probs:
    joint_state: 0.0

  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

ema:
  _target_: dexmani_policy.training.common.optimization.EMA
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true  # 仅编译 R3DTransformer。
  use_ema: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000
    log_interval_steps: 100
    gradient_accumulation_steps: 1

workspace:
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${run_id:}_seed${training.seed}
    mode: offline

env_runner:
  task_name: ${task_name}
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    randomize_model_id: true
    randomize_table_height: true

eval:
  seed: 1024
  inference_steps: 10
  use_ema: true

  action_steps: null
  episodes: 70
  selection_episodes: 25
  seeds: null

  video:
    enabled: true

hydra:
  run:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
    subdir: ${hydra.job.num}
