defaults:
  - common
  - _self_

# R3D：使用 Uni3D 编码器的三维扩散策略。

policy_name: r3d

initialization:
  uni3d: data/pretrained/uni3d

horizon: 16
n_obs_steps: 2
n_action_steps: 8
use_aux_ee: false  # 启用时要求 action_key=action，末端姿态仅作辅助预测。

normalization:
  joint_state: limits
  action: auto
  point_cloud: limits

dataloader:
  batch_size: 128
  drop_last: true

dataset:
  sensor_modalities: ["joint_state", "point_cloud"]

  # 点 dropout 在 Uni3D 内执行。
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  clip_sample: true
  _target_: dexmani_policy.agents.policies.r3d.R3DPolicy
  use_aux_ee: ${use_aux_ee}
  aux_loss_weight: 1.0

  state_dim: 19
  state_out_dim: 256

  pc_encoder_config:
    pc_model: eva02_tiny_patch14_224
    embed_dim: 256
    num_group: 512
    group_size: 32
    patch_dropout: 0.0
    drop_path_rate: 0.2

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true

  timestep_embed_dim: 128
  embedding_dim: 256
  depth: 4
  num_heads: 8
  mlp_dim: 2048
  attention_downsample_rate: 2

  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_bfloat16: true
  use_compile: true  # 仅编译 R3DTransformer。
  use_ema: true
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000

eval:
  inference_steps: 10
  use_ema: true
