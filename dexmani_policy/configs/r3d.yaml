# R3D — 3D Diffusion Policy with Uni3D encoder
# Encoder:  Uni3D (ViT-tiny, 256d, pre-trained) with color point cloud
# Decoder:  OneWayTransformer (cross-attention) + DDIM
# Modality: point_cloud(6d, xyz+rgb) + joint_state → action
# Note:     pc_dim=6 (color), use_compile=true (OneWayTransformer backbone only)
#
# Auxiliary loss: use_aux_ee predicts wrist pose (pos3+rot6d6=9dim) from
# action_ee[:9] alongside the primary joint action.  Matches official
# R3D-Policy use_target_ee design.
# Control always uses joint-only (19-dim) at inference.

policy_name: r3d

# ── Task ──
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr

# ── Core ──
seed: 42
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action                    # action | action_ee
use_aux_ee: false                     # wrist pose auxiliary loss (requires action_key='action')
joint_dim: 19                         # joint action dims
ee_dim: 9                             # wrist pose dims: pos(3) + rot6d(6), from action_ee[:9]
action_dim: ${eval:'${joint_dim} + ${ee_dim} if ${use_aux_ee} else (21 if ${eq:${action_key},action_ee} else ${joint_dim})'}

# ── Dataloader ──
# NOTE: R3D ViT encoder is memory-intensive (512 patch tokens × N samples).
# Single-GPU: batch_size=48 tested on 24 GB (15.7 GB peak).
# DDP across 4+ GPUs can use larger batches.
dataloader:
  batch_size: 48
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

val_dataloader:
  batch_size: 32
  shuffle: false
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  drop_last: false

# ── Dataset ──
dataset:
  _target_: dexmani_policy.datasets.pc_dataset.PCDataset
  action_key: ${action_key}
  use_aux_ee: ${use_aux_ee}
  zarr_path: ${zarr_path}
  seed: ${training.seed}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: ${eval:'${n_action_steps} - 1'}
  val_ratio: 0.05
  max_train_episodes: 80
  sensor_modalities: ["joint_state", "point_cloud"]
  obs_horizon: ${n_obs_steps}

  # Data augmentation aligned to official R3D-Policy (r3d_maniskill.yaml).
  # - XYZ noise: all points, always (prob=1.0), std=0.002, clip=2σ.
  # - Color jitter: additive brightness + multiplicative contrast/saturation/hue, always.
  # - RGB noise: disabled (official uses pc_rgb_noise_std=0).
  # - Dataset-level point dropout: removed (official only does encoder-level random_point_dropout).
  # See AUGMENTOR_REGISTRY in base_dataset.py for supported keys.
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.08, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

# ── Agent ──
agent:
  _target_: dexmani_policy.agents.core.r3d.R3DAgent
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}
  use_aux_ee: ${use_aux_ee}
  joint_dim: ${joint_dim}
  ee_dim: ${ee_dim}
  aux_loss_weight: 1.0              # auxiliary loss weight (matches official R3D-Policy)

  # Uni3D encoder
  pc_dim: 6
  num_points: 1024
  state_dim: 19                      # joint_state from zarr is always 19-dim
  state_out_dim: 64

  pc_encoder_config:
    pc_model: eva02_tiny_patch14_224
    embed_dim: 256
    num_group: 512
    group_size: 32
    pc_in_channels: 6
    patch_dropout: 0.0
    drop_path_rate: 0.2
    feature_mode: pointsam
    use_pretrained_weights: true
    pretrained_weights_path: data/pretrained/uni3d

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true

  # OneWayTransformer backbone
  timestep_embed_dim: 128
  embedding_dim: 256
  depth: 4
  num_heads: 8
  mlp_dim: 2048
  attention_downsample_rate: 2

  modality_dropout_probs:
    joint_state: 0.0

  # Diffusion
  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample

# ── Optimizer ──
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

# ── EMA ──
ema:
  _target_: dexmani_policy.training.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# ── Training ──
training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true                # compile_backbone() compiles OneWayTransformer only, not ViT
  use_ema: true
  use_ema_teacher_for_consistency: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 80000
    log_interval_steps: 50
    gradient_accumulation_steps: 1

# ── Workspace ──
workspace:
  _target_: dexmani_policy.training.workspace.TrainWorkspace
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${now:%Y-%m-%d_%H-%M}_${training.seed}
    id: ${policy_name}_${task_name}_${training.seed}
    resume: allow
    mode: offline
    video_fps: 15  # decoupled from env_runner; default matches frame_skip(16)/time_step(1/240)

  checkpoint_cfg:
    _target_: dexmani_policy.training.workspace.CheckpointConfig
    monitor_key: test_mean_score
    mode: max
    topk: 3

# ── Env Runner ──
env_runner:
  _target_: dexmani_policy.env_runner.sim_runner.SimRunner
  task_name: ${task_name}
  n_obs_steps: ${n_obs_steps}
  default_eval_episodes: 25
  sensor_modalities: ${dataset.sensor_modalities}
  # ── ACT temporal ensembling (Zhao et al. 2023, arXiv:2304.13705) ──
  # Blend overlapping action-chunk predictions via exponential weighting
  # to smooth transitions between consecutive inference calls.
  # Default: 0.01 (verified +2.9pp avg across 7 tasks).  Set to null to disable.
  temporal_ensemble_coeff: 0.01
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    # ── Domain randomization (convenience switches) ──
    # texture_random: when true, enables scene texture + per-episode skybox +
    #   light randomization + object texture + camera pose perturbation.
    #   Does NOT enable crazy_light (per-step color flashing).
    texture_random: false
    # instance_random: when true, enables model_id randomization.
    instance_random: true
    # table_random: when true, enables table height randomization
    #   (randomize_table_height with range [-0.05, 0.05]).
    table_random: true

# ── Eval ──
eval:
  seed: 0
  select_best:
    initial_episodes: 25
    batch_size: 5
    max_episodes: 100
    denoise_steps: 10
    use_ema: true
  offline:
    ckpt_tag_or_path: best
    eval_episodes: 100
    denoise_timesteps_list: [10]
    use_ema_for_eval: true

# ── Hydra ──
hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
    subdir: ${hydra.job.num}
