# @package _global_
# R3D — DDP multi-GPU training overlay
# Usage: bash scripts/training/train_ddp.sh ddp/r3d

defaults:
  - /r3d
  - _self_

policy_name: ddp/r3d

training:
  num_gpus: 4
  gpu_ids: null

dataloader:
  batch_size: 32
  num_workers: 4               # per-GPU cap for DDP (parent r3d has 8)
