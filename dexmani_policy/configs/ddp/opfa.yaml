# @package _global_
# OPFA — DDP multi-GPU training overlay
# Usage: bash scripts/training/train_ddp.sh ddp/opfa

defaults:
  - /opfa
  - _self_

dataloader:
  batch_size: 32
  num_workers: 2
  pin_memory: true
  persistent_workers: true

val_dataloader:
  batch_size: 32
  num_workers: 2
  pin_memory: true
  persistent_workers: false

training:
  loop:
    gradient_accumulation_steps: 4  # effective = 32*4*4 = 512 (match official OPFA)
