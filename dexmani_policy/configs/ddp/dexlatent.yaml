# @package _global_
# DexLatent — DDP multi-GPU training overlay
# Usage: bash scripts/train_ddp.sh ddp/dexlatent
#
# Effective batch size: per_gpu_batch × num_gpus × gradient_accumulation_steps
#   train: 32 × 4 × 1 = 128  (matches single-GPU 128)
#   val:   32 × 4 × 1 = 128  (matches single-GPU 128)

defaults:
  - /dexlatent
  - _self_

policy_name: ddp/dexlatent

training:
  num_gpus: 4
  gpu_ids: null

dataloader:
  batch_size: 32
  num_workers: 4

val_dataloader:
  batch_size: 32
  num_workers: 4
