# @package _global_
# MultiTask DiT — DDP multi-GPU training overlay
# Usage: bash scripts/training/train_ddp.sh ddp/multitask_dit
#
# Effective batch size: per_gpu_batch × num_gpus × gradient_accumulation_steps
#   train: 16 × 4 × 1 = 64  (matches single-GPU 64)

defaults:
  - /multitask_dit
  - _self_

policy_name: ddp/multitask_dit

training:
  num_gpus: 4
  gpu_ids: null

dataloader:
  batch_size: 16
  num_workers: 4
