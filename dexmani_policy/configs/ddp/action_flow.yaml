# @package _global_
# ActionFlow — DDP multi-GPU training overlay
# Usage: bash scripts/training/train_ddp.sh ddp/action_flow

defaults:
  - /action_flow
  - _self_

policy_name: ddp/action_flow

training:
  num_gpus: 4
  gpu_ids: null
  loop:
    # 32 × 4 GPUs × 1 = effective batch 128, matching the single-GPU recipe
    # (64 × 2). The base overlay inherits grad_accum 2, which would give 256.
    gradient_accumulation_steps: 1

dataloader:
  batch_size: 32
  num_workers: 4
