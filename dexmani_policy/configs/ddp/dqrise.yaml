# @package _global_
# DQ-RISE — DDP multi-GPU training overlay
# Usage: bash scripts/training/train_ddp.sh ddp/dqrise
#
# Effective batch size: per_gpu_batch × num_gpus × gradient_accumulation_steps
#   train: 32 × 4 × 1 = 128  (matches single-GPU dqrise.yaml: 128)

defaults:
  - /dqrise
  - _self_

policy_name: ddp/dqrise

training:
  num_gpus: 4
  gpu_ids: null

dataloader:
  batch_size: 32
  num_workers: 4
