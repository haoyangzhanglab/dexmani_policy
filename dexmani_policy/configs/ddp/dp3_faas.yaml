# @package _global_
# DP3-FAAS — DDP multi-GPU training overlay
# Usage: bash scripts/training/train_ddp.sh ddp/dp3_faas
#
# Effective batch size: per_gpu_batch × num_gpus × gradient_accumulation_steps
#   train: 32 × 4 × 1 = 128  (matches single-GPU 128)
#   val:   32 × 4 × 1 = 128  (matches single-GPU 128)

defaults:
  - /dp3_faas
  - _self_

policy_name: ddp/dp3_faas

training:
  num_gpus: 4
  gpu_ids: null

dataloader:
  batch_size: 32
  num_workers: 4

val_dataloader:
  batch_size: 32
  num_workers: 4
