# @package _global_
# SAT — DDP multi-GPU training overlay
# Usage: bash scripts/training/train_ddp.sh ddp/sat
#
# Effective batch size: per_gpu_batch × num_gpus × gradient_accumulation_steps
#   train: 32 × 4 × 1 = 128  (matches single-GPU 128)

defaults:
  - /sat
  - _self_

policy_name: ddp/sat

training:
  num_gpus: 4
  gpu_ids: null

dataloader:
  batch_size: 32
  num_workers: 4
