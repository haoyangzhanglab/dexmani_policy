# ActionFlow — 3D geometry memory + action-centric DiT + Rectified Flow policy
# Encoder:  PointNeXT local tokenizer (192×256) → joint two-frame GeoFormer (4L×576,
#           3D RoPE) → static [B, 385, 384] geometry memory
# Decoder:  ActionFlowDiT (8L×768, SA→CA→FFN, 12Q/12KV full CA, SwiGLU-1536,
#           compact 384 conditioner, static KV cache) + SimpleRectifiedFlow
# Modality: point_cloud + joint_state → action
# Params:   baseline (ctx 768/ffn 2048) ≈ 97.2M；当前 config (ctx 384/ffn 1536) ≈ 75.7M

policy_name: action_flow

# ── Task ──
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr

# ── Core ──
seed: 42
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action
action_dim: ${eval:'21 if ${eq:${action_key},action_ee} else 19'}

# ── Dataloader ──
# The model with 192×256 patch tokens does not fit at batch 128 on a 24GB
# card (measured peak: 21.7 GiB bf16 / OOM fp32). batch 64 × grad-accum 2 keeps
# the effective batch at 128 and the optimizer-step count at 100k — identical
# recipe, ~11 GiB peak.
dataloader:
  batch_size: 64
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

val_dataloader:
  batch_size: 64
  shuffle: false
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  drop_last: false

# ── Dataset ──
dataset:
  _target_: dexmani_policy.datasets.pc_dataset.PCDataset
  action_key: ${action_key}
  zarr_path: ${zarr_path}
  seed: ${training.seed}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: ${eval:'${n_action_steps} - 1'}
  val_ratio: 0.0
  max_train_episodes: 80
  sensor_modalities: ["joint_state", "point_cloud"]
  obs_horizon: ${n_obs_steps}

  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.08, prob: 1.0}
      dropout:     {dropout_ratio: 0.25, prob: 0.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

# ── Agent ──
agent:
  _target_: dexmani_policy.agents.core.action_flow.ActionFlowAgent
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}

  pc_dim: 6
  state_dim: ${action_dim}
  num_points: 1024

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true

  # PointNeXT is a *local* patch tokenizer only — no global token, no internal
  # patch self-attention. Relational reasoning belongs to the GeoFormer.
  pc_encoder_config:
    num_patches: 192
    stem_channels: 128
    token_channels: 256
    patch_radii: [0.04, 0.08]
    patch_neighbors: [16, 32]
    use_patch_self_attn: false

  # GeoFormer — joint two-frame 3D relational reasoning (384 patches + 1 CLS)
  geo_hidden_dim: 576
  geo_depth: 4
  geo_num_heads: 12
  geo_ffn_hidden_dim: 1536
  geo_qk_norm: true
  geo_use_3d_rope: true
  # 3D RoPE wavelengths (normalized [-1,1] units), preserving the relationship
  # to patch_radii (min ≈ 0.5·r_small, max ≈ 25·r_large).
  geo_min_wavelength: 0.02
  geo_max_wavelength: 2.0
  geo_attn_drop: 0.0
  # Stochastic-depth peak rate; ramps linearly 0 -> this across the 4 blocks.
  geo_drop_path: 0.0
  absolute_3d_pe_dim: 96

  # ActionFlow DiT backbone
  hidden_dim: 768
  # Compact geometry->action bandwidth: 768 -> 384 (memory_proj/abs_pe_proj/cross-attn
  # K/V all follow ctx_dim via the ActionFlowAgent resolve).
  context_dim: 384
  depth: 8
  num_heads: 12
  ffn_hidden_dim: 1536
  qk_norm: true
  attn_drop: 0.0

  # Global conditioning: state + flow timestep + step size → compact latent
  timestep_embed_dim: 128
  step_embed_dim: 64
  state_embed_hidden_dim: 256
  cond_bottleneck_dim: 384

  # Standard rectified flow
  # For ActionFlow, denoise_steps is the number of function evaluations (NFE).
  denoise_steps: 2
  # euler accepts any positive NFE; midpoint requires an even NFE.
  solver: midpoint
  # 75% NoiseShift(alpha=3) + 25% uniform i.i.d. mixture
  noise_shift_alpha: 3.0
  noise_shift_ratio: 0.75
  # step_size is hardcoded to 0, so the step_embedder is a meaningless constant
  # bias. Gate it off (module kept but frozen; state_dict keys unchanged).
  use_step_conditioning: false

  modality_dropout_probs:
    joint_state: 0.0

# ── Optimizer ──
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-3
  betas: [0.9, 0.95]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

# ── EMA ──
ema:
  _target_: dexmani_policy.training.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
  # Fuse the per-param EMA update into _foreach_mul_/_foreach_add_ (dtype-bucketed).
  foreach: true

# ── Training ──
training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  # torch.compile mode. `reduce-overhead` (CUDA graphs) produces non-finite
  # gradients under bf16 in the ActionFlowDiT (reproduced at step ~326); the
  # plain `default` inductor mode is numerically stable for this architecture.
  compile_mode: default
  use_ema: true
  use_ema_teacher_for_consistency: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  # Fuse the gradient finite-check into clip_grad_norm_(error_if_nonfinite=True);
  # avoids the per-param torch.isfinite loop + GPU→CPU sync on the happy path.
  fast_grad_finite_check: true
  loop:
    total_train_steps: 100000
    log_interval_steps: 50
    # 64 × 2 = effective batch 128 (global_step counts optimizer steps only)
    gradient_accumulation_steps: 2

# ── Workspace ──
workspace:
  _target_: dexmani_policy.training.workspace.TrainWorkspace
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${now:%Y-%m-%d_%H-%M}_${training.seed}
    id: ${policy_name}_${task_name}_${training.seed}
    resume: allow
    mode: offline
    video_fps: 15

  checkpoint_cfg:
    _target_: dexmani_policy.training.workspace.CheckpointConfig
    monitor_key: test_mean_score
    mode: max
    topk: 3

# ── Env Runner ──
env_runner:
  _target_: dexmani_policy.env_runner.sim_runner.SimRunner
  task_name: ${task_name}
  n_obs_steps: ${n_obs_steps}
  default_eval_episodes: 25
  sensor_modalities: ${dataset.sensor_modalities}
  temporal_ensemble_coeff: 0.01
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    texture_random: false
    instance_random: true
    table_random: true

# ── Eval ──
eval:
  denoise_steps: 2
  denoise_timesteps_list: null
  use_ema: true

  select_best:
    initial_episodes: 25
    batch_size: 5
    max_episodes: 100

  offline:
    episodes: 100

  demo:
    episodes: 5
    viewer_resolution: [1920, 1080]

  video:
    enabled: true
    fps: null

# ── Hydra ──
hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
    subdir: ${hydra.job.num}
