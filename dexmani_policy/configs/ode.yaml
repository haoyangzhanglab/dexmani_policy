defaults:
  - common
  - _self_

# ODE：19 维绝对关节目标；这些迁移初值尚未调优。

policy_name: ode

horizon: 9
n_obs_steps: 2
n_action_steps: 8

normalization:
  joint_state: limits
  point_cloud: limits

dataloader:
  batch_size: 128
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.variants.ode.ODEDataset
  sensor_modalities: ["joint_state", "point_cloud"]

  # 点 dropout 在 Dataset 中执行。
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
      dropout:     {max_dropout_ratio: 0.8, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  _target_: dexmani_policy.agents.policies.ode.ODEPolicy
  pc_dim: 6
  pc_out_dim: 128
  state_dim: 19
  num_points: 1024
  fps_random_config:
    use_random: true
    use_random_start: true
    use_shuffle_output: false
  cond_dim: 512
  hidden_dim: 512
  num_layers: 4
  solver: euler
  vel_scale: 0.05
  perturb_prob: 0.5
  perturb_decay: 0.7
  perturb_std: 0.01  # rad；也可设为每关节一个值。
  side_head: 0  # 12 启用 detached diversity head。
  eps_center: true

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_bfloat16: false
  use_compile: true
  use_ema: true
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000

eval:
  inference_steps: 1  # 每个控制周期的数值子步数。
  use_ema: ${training.use_ema}
