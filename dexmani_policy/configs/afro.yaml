defaults:
  - common
  - _self_

policy_name: afro
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_dim: 19
normalization:
  joint_state: limits
  action: auto
  point_cloud: limits
dataloader:
  batch_size: 128
  drop_last: false
dataset:
  _target_: dexmani_policy.datasets.common.robot_dataset.RobotDataset
  pc_dim: ${agent.pc_dim}
  pad_after: ${eval:'${n_action_steps} - 1'}
  sensor_modalities: [point_cloud, joint_state]
  augmentation_cfg: null
agent:
  _target_: dexmani_policy.agents.policies.afro.AFROPolicy
  state_dim: 19
  pc_dim: 3
  pretrained_path: null
  freeze_visual: true
  down_dims: [512, 1024, 2048]
  diffusion_step_embed_dim: 128
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample
  clip_sample: true
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  eps: 1.0e-8
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6
training:
  use_bfloat16: false
  use_compile: false
  use_ema: false
  lr_scheduler: cosine
  lr_warmup_steps: 0
  max_grad_norm: 0
  loop:
    total_train_steps: 100000
env_runner:
  env_kwargs:
    control_mode: joint
eval:
  inference_steps: 10
  use_ema: false
