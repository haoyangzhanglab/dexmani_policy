# State-conditioned temporal hand codec (arXiv:2609.19666) + flow matching.
# Pretrain the codec once; frozen encoder means supply BC targets online.
policy_name: latent_flow
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr
seed: 42
horizon: 32
n_obs_steps: 2
n_action_steps: 25
action_key: action
action_dim: 19

data_semantics:
  action_space: joint
  action_coordinates: absolute_joint_command
  joint_order: ['arm:7', 'thumb:3', 'index:3', 'middle:2', 'ring:2', 'pinky:2']
  units: radians
  obs_alignment: 'obs[t]_before_action[t]'
  reference: measured_query_state
  window: query_future_full_horizon

codec:
  path: experiments/hand_vae/${task_name}/codec.pt
  latent_dim: 9             # Paper default; configurable for the 12-DoF hand.
  hidden_dim: 128
  n_layers: 3
  n_heads: 4
  mlp_ratio: 2.0

normalization:
  joint_state: limits
  action: auto
  point_cloud: identity

dataloader:
  batch_size: 64
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.hand_prior.latent_flow_dataset.LatentFlowDataset
  zarr_path: ${zarr_path}
  action_key: ${action_key}
  pc_dim: ${agent.pc_dim}
  seed: 0                 # Split/subset seed; independent of model training seed.
  data_semantics: ${data_semantics}
  source_id: null
  horizon: ${horizon}
  obs_horizon: ${n_obs_steps}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: 0
  val_ratio: 0.1
  max_train_episodes: 80
  split_manifest: null
  sensor_modalities: [joint_state, point_cloud]
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color: {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
      dropout: {max_dropout_ratio: 0.8, prob: 1.0}
    state:
      noise: {noise_std: 0.0002, prob: 1.0}

agent:
  _target_: dexmani_policy.agents.policies.latent_flow.LatentFlowPolicy
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}
  codec_path: ${codec.path}
  latent_dim: ${codec.latent_dim}
  codec_hidden_dim: ${codec.hidden_dim}
  codec_n_layers: ${codec.n_layers}
  codec_n_heads: ${codec.n_heads}
  codec_mlp_ratio: ${codec.mlp_ratio}
  pc_dim: 6
  state_dim: 19
  state_out_dim: 64
  num_points: 1024
  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true
  pc_encoder_config:
    channels: 384
    num_patches: 96
    group_size: 32
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    geometry_scale: 0.10
    rope_scale: 0.05
    rope_base: 100.0
  n_layers: 8
  hidden_dim: 768
  n_head: 8
  mlp_ratio: 4.0
  p_drop_attn: 0.1
  qkv_bias: true
  qk_norm: true
  num_inference_steps: 10
  t_sample_mode_for_flow: beta
  beta_s: 0.999
  beta_alpha: 1.0
  beta_beta: 1.5
  # Each loss is a mean over its own coordinates and full horizon.
  arm_loss_weight: 1.0
  latent_loss_weight: 0.25
  # Decoded MSE is always in standardized relative coordinates.
  decoded_loss_weight: 0.75
  modality_dropout_probs:
    joint_state: 0.0

optimizer:
  lr: 5.0e-5
  weight_decay: 1.0e-10
  betas: [0.9, 0.95]
  eps: 1.0e-8
  obs_lr: 5.0e-5
  obs_weight_decay: 1.0e-10

ema:
  _target_: dexmani_policy.training.common.ema.EMA
  fixed_decay: 0.99

training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  use_ema: true
  lr_scheduler: cosine_min_lr
  lr_min_ratio: 0.1
  lr_warmup_steps: 1000
  max_grad_norm: 1.0
  loop:
    total_train_steps: 30000
    log_interval_steps: 100
    gradient_accumulation_steps: 1

workspace:
  _target_: dexmani_policy.training.workspace.Workspace
  output_dir: ${hydra:runtime.output_dir}
  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${run_id:}_seed${training.seed}
    mode: offline

env_runner:
  task_name: ${task_name}
  # Independent simulator state for each evaluation episode.
  clear_cache_freq: 1
  env_kwargs:
    control_mode: joint
    texture_random: false
    instance_random: true
    table_random: true

eval:
  seed: 1024
  inference_steps: 10
  use_ema: true
  action_steps: null
  episodes: 70
  selection_episodes: 25
  task_seeds: null

  video:
    enabled: true

hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
    subdir: ${hydra.job.num}
