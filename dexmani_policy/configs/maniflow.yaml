# ManiFlow：结合 flow matching 与 EMA 一致性训练。

policy_name: maniflow

task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr

seed: 42
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action  # action：关节；action_ee：末端。
action_dim: ${eval:'21 if ${eq:${action_key},action_ee} else 19'}

normalization:
  joint_state: limits
  action: auto
  point_cloud: identity  # XYZ 保留物理坐标，RGB 保持 [0, 1]。

dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

dataset:
  pc_dim: ${agent.pc_dim}
  _target_: dexmani_policy.datasets.common.robot_dataset.RobotDataset
  action_key: ${action_key}
  zarr_path: ${zarr_path}
  seed: 42  # 数据划分/子集 seed，独立于训练 seed。
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: 7
  val_ratio: 0.0
  max_train_episodes: 80
  sensor_modalities: ["joint_state", "point_cloud"]
  obs_horizon: ${n_obs_steps}

  # 不使用点 dropout，避免重复 token 改变交叉注意力权重。
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  _target_: dexmani_policy.agents.policies.maniflow.ManiFlowPolicy
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}

  pc_dim: 6
  state_dim: 19
  state_out_dim: 64
  num_points: 1024  # 每帧点 token 数。

  # 输入点数超过 num_points 时才执行 FPS。
  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true

  # PointNetDense 保留逐点 token。
  pc_encoder_config:
    out_channels: 128

  n_layers: 12
  hidden_dim: 768
  n_head: 8
  mlp_ratio: 4.0
  p_drop_attn: 0.1
  # qkv_bias 和 qk_norm 仅作用于交叉注意力。
  qkv_bias: false
  qk_norm: false
  pre_norm_modality: false

  timestep_embed_dim: 128
  target_t_embed_dim: 128

  denoise_timesteps: 10  # 一致性训练的离散时间网格。
  num_inference_steps: 10  # 默认 Euler 推理步数。
  flow_batch_ratio: 0.75
  t_sample_mode_for_flow: beta
  t_sample_mode_for_consistency: discrete
  dt_sample_mode_for_consistency: uniform
  target_t_sample_mode: relative

  modality_dropout_probs:
    joint_state: 0.0

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-3
  betas: [0.9, 0.95]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

ema:
  _target_: dexmani_policy.training.common.optimization.EMA
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  use_ema: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000
    log_interval_steps: 100
    gradient_accumulation_steps: 1

workspace:
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${run_id:}_seed${training.seed}
    mode: offline

env_runner:
  task_name: ${task_name}
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    randomize_model_id: true
    randomize_table_height: true

eval:
  seed: 1024
  inference_steps: 4  # 评测 NFE，独立于训练时间网格。
  use_ema: true

  action_steps: null
  episodes: 70
  selection_episodes: 25
  seeds: null

  video:
    enabled: true

hydra:
  run:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
    subdir: ${hydra.job.num}
