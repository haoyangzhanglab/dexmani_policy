# ManiFlow — Flow Matching with rectified flow + consistency training
# Encoder:  PointNetDense (per-point features, 256 points, 128d)
# Decoder:  DiTX (cross-attention conditioning) + Euler ODE integration
# Modality: point_cloud + joint_state → action
# Key:      use_ema_teacher_for_consistency=true, target_t=0 for rectified flow

policy_name: maniflow

# ── Task ──
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr

# ── Core ──
seed: 42
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action                    # action | action_ee
action_dim: ${eval:'21 if ${eq:${action_key},action_ee} else 19'}

# ── Dataloader ──
dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

val_dataloader:
  batch_size: 128
  shuffle: false
  num_workers: 8
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  drop_last: false

# ── Dataset ──
dataset:
  _target_: dexmani_policy.datasets.pc_dataset.PCDataset
  action_key: ${action_key}
  zarr_path: ${zarr_path}
  seed: ${training.seed}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: ${eval:'${n_action_steps} - 1'}
  val_ratio: 0.05
  max_train_episodes: 80
  sensor_modalities: ["joint_state", "point_cloud"]
  obs_horizon: ${n_obs_steps}

  # Data augmentation aligned to official R3D-Policy.
  # See AUGMENTOR_REGISTRY in base_dataset.py for supported keys.
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.08, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

# ── Agent ──
agent:
  _target_: dexmani_policy.agents.core.maniflow.ManiFlowAgent
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}

  encoder_type: pointnet_dense
  pc_dim: 3                       # xyz-only (matching official ManiFlow)
  state_dim: 19
  num_points: 256                 # per-point token count per frame

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true

  # PointNetDense encoder — per-point MLP, no pooling
  pc_encoder_config:
    out_channels: 128
    num_points: 256
    hidden_dims: [64, 128, 256]

  # DiTX backbone
  n_layers: 12
  hidden_dim: 768
  n_head: 8
  mlp_ratio: 4.0
  p_drop_attn: 0.1
  qkv_bias: false
  qk_norm: false
  pre_norm_modality: false

  timestep_embed_dim: 128
  target_t_embed_dim: 128

  # Flow matching
  denoise_timesteps: 10
  flow_batch_ratio: 0.75
  t_sample_mode_for_flow: beta
  t_sample_mode_for_consistency: discrete
  dt_sample_mode_for_consistency: uniform
  target_t_sample_mode: relative

  modality_dropout_probs:
    joint_state: 0.0                # 20% state dropout — forces reliance on point cloud

# ── Optimizer ──
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-3            # DiT backbone: high wd is standard for transformers (vs 1e-6 for UNet)
  betas: [0.9, 0.95]              # lower β1 = shorter gradient EMA, common for flow matching
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6        # PC encoder: lighter regularization than DiT backbone

# ── EMA ──
ema:
  _target_: dexmani_policy.training.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# ── Training ──
training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  use_ema: true
  use_ema_teacher_for_consistency: true   # required: inference uses target_t=dt>0
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000
    log_interval_steps: 50
    gradient_accumulation_steps: 1

# ── Workspace ──
workspace:
  _target_: dexmani_policy.training.workspace.TrainWorkspace
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${now:%Y-%m-%d_%H-%M}_${training.seed}
    id: ${policy_name}_${task_name}_${training.seed}
    resume: allow
    mode: offline
    video_fps: 15  # decoupled from env_runner; default matches frame_skip(16)/time_step(1/240)

  checkpoint_cfg:
    _target_: dexmani_policy.training.workspace.CheckpointConfig
    monitor_key: test_mean_score
    mode: max
    topk: 3

# ── Env Runner ──
env_runner:
  _target_: dexmani_policy.env_runner.sim_runner.SimRunner
  task_name: ${task_name}
  n_obs_steps: ${n_obs_steps}
  default_eval_episodes: 25        # PC-based policies: 25; RGB-based: 20
  sensor_modalities: ${dataset.sensor_modalities}
  # ── ACT temporal ensembling (Zhao et al. 2023, arXiv:2304.13705) ──
  # Blend overlapping action-chunk predictions via exponential weighting
  # to smooth transitions between consecutive inference calls.
  # Default: 0.01 (verified +2.9pp avg across 7 tasks).  Set to null to disable.
  temporal_ensemble_coeff: 0.01
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    # ── Domain randomization (convenience switches) ──
    # texture_random: when true, enables scene texture + per-episode skybox +
    #   light randomization + object texture + camera pose perturbation.
    #   Does NOT enable crazy_light (per-step color flashing).
    texture_random: false
    # instance_random: when true, enables model_id randomization.
    instance_random: true
    # table_random: when true, enables table height randomization
    #   (randomize_table_height with range [-0.05, 0.05]).
    table_random: true

# ── Eval ──
eval:
  denoise_steps: 10
  use_ema: true

  select_best:
    initial_episodes: 25
    batch_size: 5
    max_episodes: 100

  offline:
    episodes: 100

  demo:
    episodes: 5
    viewer_resolution: [1920, 1080]

  video:
    enabled: true
    fps: null
# ── Hydra ──
hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${now:%Y-%m-%d_%H-%M}_${training.seed}
    subdir: ${hydra.job.num}
