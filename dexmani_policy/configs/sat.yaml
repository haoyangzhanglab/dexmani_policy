defaults:
  - common
  - _self_

# SAT 动作表示 + 六个逐帧手物交互 token 和标准 flow。
# agent.backbone_type=dit 切换到 SmolVLA 风格 action expert。

policy_name: sat

initialization:
  rgb: data/pretrained/dinov2-small

horizon: 16
n_obs_steps: 2
n_action_steps: 8

normalization:
  point_cloud: identity
  rgb: identity
  camera_intrinsic: identity
  camera_extrinsic: identity
  eef_pose: identity
  fingertip_xyz: identity
  finger_tactile_force: identity

dataloader:
  batch_size: 128
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.demonstration.DemonstrationDataset
  sensor_modalities: [point_cloud, rgb, camera_intrinsic, camera_extrinsic, eef_pose, fingertip_xyz, finger_tactile_force]

agent:
  action_dim: null
  _target_: dexmani_policy.agents.policies.sat.SAT
  backbone_type: ditx

  pc_dim: 3
  num_points: 1024

  fps_random_config:
    use_random: true
    use_random_start: true
    use_shuffle_output: false

  patch_config:
    local_hidden_dim: 32
    num_patches: 128
    group_size: 32
    geometry_scale: 0.10

  spatial_config:
    depth: 2
    num_heads: 8
    mlp_ratio: 2.0
    rope_scale: 0.05
    rope_base: 100.0

  rgb_patch_sampling: center
  rgb_backbone_name: dino
  rgb_backbone_config:
    tune_mode: freeze
    image_size: [224, 224]

  n_layers: 6
  hidden_dim: 768
  n_head: 8
  mlp_ratio: 4.0
  p_drop_attn: 0.1
  qkv_bias: false
  qk_norm: false
  timestep_embed_dim: 128

  num_inference_steps: 5
  time_shift_alpha: 3.0  # Training only; >1 shifts uniform samples toward noise (t=0).

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-3
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_compile: true

eval:
  inference_steps: ${agent.num_inference_steps}
