defaults:
  - common
  - _self_

# SAT：共享 spatial observation，每个关节的完整轨迹形成一个结构化动作 token。

policy_name: sat

initialization:
  rgb: facebook/dinov2-small

horizon: 16
n_obs_steps: 2
n_action_steps: 8

normalization:
  joint_state: limits
  action: auto
  point_cloud: identity  # 保留 XYZ 物理坐标。
  rgb: identity
  camera_intrinsic: identity
  camera_extrinsic: identity

dataloader:
  batch_size: 128
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.demonstration.DemonstrationDataset
  sensor_modalities: ["joint_state", "point_cloud", "rgb", "camera_intrinsic", "camera_extrinsic"]
  rgb_keep_uint8: true

  augmentation_cfg:
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  _target_: dexmani_policy.agents.policies.sat.SATPolicy

  pc_dim: 3
  state_dim: 19
  num_points: 1024

  fps_random_config:
    use_random: true
    use_random_start: true
    use_shuffle_output: false
    random_noise_scale: 0.0

  pc_encoder_config:
    channels: 192
    num_patches: 96
    group_size: 32
    depth: 2
    num_heads: 8
    mlp_ratio: 2.0
    geometry_scale: 0.10
    rope_scale: 0.05
    rope_base: 100.0

  rgb_backbone_config:
    tune_mode: freeze
    image_size: [224, 224]

  fusion_stage: pre_global
  semantic_pool_sigma: 0.04

  n_layers: 8
  hidden_dim: 256
  n_head: 8
  mlp_ratio: 4.0
  p_drop_attn: 0.0
  timestep_embed_dim: 256

  num_inference_steps: 10

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_bfloat16: true
  use_compile: true
  use_ema: true
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000

eval:
  inference_steps: ${agent.num_inference_steps}
  use_ema: true
