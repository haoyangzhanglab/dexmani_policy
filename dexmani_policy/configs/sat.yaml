defaults:
  - common
  - _self_

# SAT：将动作维度作为 token 的结构化 flow 策略。

policy_name: sat

horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_dim: 19

normalization:
  joint_state: limits
  action: auto
  point_cloud: identity  # 保留 XYZ 物理坐标。

dataloader:
  batch_size: 128
  drop_last: true

dataset:
  pc_dim: ${agent.pc_dim}
  _target_: dexmani_policy.datasets.common.robot_dataset.RobotDataset
  pad_after: 7
  sensor_modalities: ["joint_state", "point_cloud"]

  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

agent:
  _target_: dexmani_policy.agents.policies.sat.SATPolicy

  pc_dim: 6
  state_dim: 19
  state_out_dim: 64
  num_points: 1024

  fps_random_config:
    use_random: true
    use_random_start: true
    use_shuffle_output: false
    random_noise_scale: 0.0

  pc_encoder_config:
    channels: 384
    num_patches: 96
    group_size: 32
    depth: 4
    num_heads: 8
    mlp_ratio: 2.0
    geometry_scale: 0.10
    rope_scale: 0.05
    rope_base: 100.0

  n_layers: 8
  hidden_dim: 256
  n_head: 8
  mlp_ratio: 4.0
  p_drop_attn: 0.0
  qkv_bias: true
  qk_norm: true

  num_inference_steps: 10
  t_sample_mode_for_flow: uniform

  modality_dropout_probs:
    joint_state: 0.0

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

ema:
  _target_: dexmani_policy.training.common.optimization.EMA
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

training:
  use_bfloat16: true
  use_compile: true
  use_ema: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000

env_runner:
  env_kwargs:
    control_mode: joint

eval:
  inference_steps: ${agent.num_inference_steps}
  use_ema: true
