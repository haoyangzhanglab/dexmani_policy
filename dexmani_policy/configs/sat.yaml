# SAT — local Structural Action Transformer adaptation
# Encoder:  Sparse3DEncoder (384d spatial tokens + mean-pooled global token)
# Decoder:  SAT (joint trajectories with observation-prefix attention) + Flow Matching
# Modality: point_cloud + joint_state → action
# Key:      structural-centric action representation (Da as sequence, T as feature)

policy_name: sat

# ── Task ──
task_name: pick_apple_messy
zarr_path: robot_data/${task_name}.zarr

# ── Core ──
seed: 42
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_key: action                    # action | action_ee
action_dim: ${eval:'21 if ${eq:${action_key},action_ee} else 19'}

# ── Normalization ──
normalization:
  joint_state: limits
  action: auto
  point_cloud: identity

# ── Dataloader ──
dataloader:
  batch_size: 128
  shuffle: true
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: true

# ── Dataset ──
dataset:
  pc_dim: ${agent.pc_dim}
  _target_: dexmani_policy.datasets.point_cloud_dataset.PointCloudDataset
  action_key: ${action_key}
  zarr_path: ${zarr_path}
  seed: ${training.seed}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps} - 1'}
  pad_after: ${eval:'${n_action_steps} - 1'}
  val_ratio: 0.0
  max_train_episodes: 80
  sensor_modalities: ["joint_state", "point_cloud"]
  obs_horizon: ${n_obs_steps}

  # Shared R3D-derived sensor recipe; dataset dropout precedes encoder patch FPS.
  augmentation_cfg:
    pc:
      coord_noise: {noise_std: 0.002, prob: 1.0}
      color:       {brightness: 0.125, contrast: 0.5, saturation: 0.5, hue: 0.0, prob: 1.0}
      dropout:     {max_dropout_ratio: 0.8, prob: 1.0}
    state:
      noise:       {noise_std: 0.0002, prob: 1.0}

# ── Agent ──
agent:
  _target_: dexmani_policy.agents.core.sat_policy.SATPolicy
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  action_dim: ${action_dim}

  # Obs encoder: Sparse3DEncoder patches + mean global token; temporal feature fusion
  pc_dim: 6
  state_dim: 19
  num_points: 1024

  fps_random_config:
    use_random: true
    use_random_start: true
    random_noise_scale: 0.0
    use_shuffle_output: true

  pc_encoder_config:
    channels: 384
    num_patches: 96
    group_size: 32
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    geometry_scale: 0.10
    rope_scale: 0.05
    rope_base: 100.0

  # SAT backbone (structural-centric DiT)
  n_layers: 8
  hidden_dim: 768
  n_head: 8
  mlp_ratio: 4.0
  p_drop_attn: 0.1
  qkv_bias: true
  qk_norm: true

  # EJC defaults identify joints without anatomical function or axis labels.
  ejc_num_embodiments: 1
  # ejc_num_functions defaults to action_dim.
  ejc_num_axes: 1
  ejc_embodiment_dim: 8
  ejc_function_dim: 32
  ejc_axis_dim: 8

  # Flow matching (standard CFM, no consistency training)
  num_inference_steps: 10
  t_sample_mode_for_flow: beta
  # Explicit local time-sampling recipe; matches SATPolicy defaults.
  beta_s: 0.999
  beta_alpha: 1.0
  beta_beta: 1.5

  modality_dropout_probs:
    joint_state: 0.0

# ── Optimizer ──
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

# ── EMA ──
ema:
  _target_: dexmani_policy.training.common.ema.EMA
  accumulation_dtype: float32
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# ── Training ──
training:
  seed: ${seed}
  device: cuda:0
  use_bfloat16: true
  use_compile: true
  use_ema: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_grad_norm: 1.0
  loop:
    total_train_steps: 100000
    log_interval_steps: 100
    gradient_accumulation_steps: 1

# ── Workspace ──
workspace:
  _target_: dexmani_policy.training.workspace.Workspace
  output_dir: ${hydra:runtime.output_dir}

  wandb_cfg:
    _target_: dexmani_policy.training.workspace.WandbConfig
    project: dexmani_policy
    group: ${policy_name}
    name: ${task_name}_${run_id:}_seed${training.seed}
    mode: offline

# ── Env Runner ──
env_runner:
  _target_: dexmani_policy.env_runner.sim_runner.SimRunner
  task_name: ${task_name}
  n_obs_steps: ${n_obs_steps}
  default_eval_episodes: 25
  sensor_modalities: ${dataset.sensor_modalities}
  env_kwargs:
    control_mode: ${eval:'"ee" if ${eq:${action_key},action_ee} else "joint"'}
    texture_random: false
    instance_random: true
    table_random: true

# ── Eval ──
eval:
  seed: 1024
  inference_steps: 10
  inference_steps_list: null
  use_ema: true

  select_best:
    initial_episodes: 25
    batch_size: 5
    max_episodes: 100

  offline:
    episodes: 100

  demo:
    episodes: 5
    viewer_resolution: [1280, 960]

  video:
    enabled: true
    fps: null
# ── Hydra ──
hydra:
  job:
    override_dirname: ${policy_name}_${task_name}
  run:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
  sweep:
    dir: experiments/${policy_name}/${task_name}/${run_id:}_seed${training.seed}
    subdir: ${hydra.job.num}
