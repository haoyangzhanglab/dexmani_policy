defaults:
  - common
  - _self_

policy_name: cordvip
zarr_path: robot_data/${task_name}.cordvip.zarr
horizon: 12
n_obs_steps: 4
n_action_steps: 6
normalization:
  joint_state: limits
  action: auto
  hand_pointcloud: limits
  object_pointcloud: limits
dataloader:
  batch_size: 256
  drop_last: false
dataset:
  _target_: dexmani_policy.datasets.demonstration.DemonstrationDataset
  sensor_modalities: [hand_pointcloud, object_pointcloud, joint_state]
  augmentation_cfg: null
agent:
  _target_: dexmani_policy.agents.policies.cordvip.CordViPPolicy
  state_dim: 19
  pc_dim: 3
  pretrained_path: null
  down_dims: [512, 1024, 2048]
  diffusion_step_embed_dim: 64
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample
  clip_sample: true
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  eps: 1.0e-8
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6
ema:
  _target_: dexmani_policy.training.common.optimization.EMA
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
training:
  use_bfloat16: false
  use_compile: false
  use_ema: true
  lr_warmup_steps: 500
  max_grad_norm: 0
  loop:
    total_train_steps: 100000
env_runner:
  env_kwargs:
eval:
  inference_steps: 10
  use_ema: true
