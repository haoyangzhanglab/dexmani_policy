defaults:
  - common
  - _self_

policy_name: cordvip
initialization:
  encoder: null
zarr_path: robot_data/${task_name}.cordvip.zarr
horizon: 16
n_obs_steps: 3
n_action_steps: 8
normalization:
  joint_state: limits
  hand_pointcloud: limits
  object_pointcloud: limits
dataloader:
  batch_size: 128
  drop_last: false
dataset:
  pc_dim: 3
  _target_: dexmani_policy.datasets.demonstration.DemonstrationDataset
  sensor_modalities: [hand_pointcloud, object_pointcloud, joint_state]
  augmentation_cfg: null
agent:
  _target_: dexmani_policy.agents.policies.cordvip.CordViP
  down_dims: [512, 1024, 2048]
  diffusion_step_embed_dim: 64
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  num_training_steps: 100
  num_inference_steps: 10
  prediction_type: sample
  clip_sample: true
optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6
training:
  use_compile: false
  max_grad_norm: 0
eval:
  inference_steps: ${agent.num_inference_steps}
