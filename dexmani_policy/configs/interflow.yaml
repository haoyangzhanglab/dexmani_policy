defaults:
  - common
  - _self_

policy_name: interflow

initialization:
  rgb: data/pretrained/dinov3-small

horizon: 16
n_obs_steps: 2
n_action_steps: 8

normalization:
  joint_state: limits
  point_cloud: identity
  rgb: identity
  camera_intrinsic: identity
  camera_extrinsic: identity
  eef_pose: identity
  fingertip_xyz: identity
  finger_tactile_force: identity

dataloader:
  batch_size: 128
  drop_last: true

dataset:
  _target_: dexmani_policy.datasets.demonstration.DemonstrationDataset
  sensor_modalities:
    - joint_state
    - point_cloud
    - rgb
    - camera_intrinsic
    - camera_extrinsic
    - eef_pose
    - fingertip_xyz
    - finger_tactile_force
  augmentation_cfg: null

agent:
  _target_: dexmani_policy.agents.policies.interflow.InterFlow
  action_dim: null
  state_dim: 19
  pc_dim: 3
  num_points: 1024

  rgb_backbone_name: dinov3
  rgb_backbone_config:
    tune_mode: freeze
    image_size: [224, 224]
  rgb_patch_sampling: center

  n_layers: 6
  hidden_dim: 768
  n_head: 8
  mlp_ratio: 4.0
  p_drop_attn: 0.1
  qkv_bias: false
  qk_norm: false
  timestep_embed_dim: 128

  num_inference_steps: 8
  time_shift_alpha: 1.0

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-3
  betas: [0.95, 0.999]
  obs_lr: 1.0e-4
  obs_weight_decay: 1.0e-6

training:
  use_compile: true

eval:
  inference_steps: ${agent.num_inference_steps}
